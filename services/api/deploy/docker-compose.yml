# Single-host production-style stack: Postgres, S3 storage (Garage), migrations, API and worker (NFR-013).
#   cp .env.example .env   # set real secrets
#   docker compose --profile storage up -d --build   # --profile storage adds the bundled Garage
#   ./garage-bootstrap.sh                             # first run only, when using bundled Garage
# Using an external S3 (AWS S3, R2, B2)? Skip the "storage" profile and point S3_* at it in .env.
name: doro-cam-prod

x-api-env: &api-env
  NODE_ENV: production
  HOST: 0.0.0.0
  DATABASE_URL: postgres://${POSTGRES_USER:-doro}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doro}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
  # The address phones and browsers use for uploads and downloads; the bundled Garage is published on S3_PORT.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-garage}
  S3_BUCKET: ${S3_BUCKET:-doro-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (at least 32 random characters)}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-doro}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doro} -d ${POSTGRES_DB:-doro}"]
      interval: 3s
      timeout: 3s
      retries: 20

  garage:
    profiles: ["storage"]
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  migrate:
    build: { context: ../../.., dockerfile: services/api/Dockerfile }
    image: doro-api:local
    command: ["node", "dist/db/migrate-cli.js"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: doro-api:local
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    environment: *api-env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: doro-api:local
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres-data:
  garage-meta:
  garage-data:
