name: mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/doro_camera/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/doro_camera/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  dart:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test with coverage
        working-directory: apps/mobile
        run: flutter test --coverage

      - name: Analyze the camera plugin
        working-directory: packages/doro_camera
        run: flutter analyze

      - name: Test the camera plugin with coverage
        working-directory: packages/doro_camera
        run: flutter test --coverage

      - name: Pigeon output is up to date
        working-directory: packages/doro_camera
        run: |
          dart run pigeon --input pigeons/camera_api.dart
          git diff --exit-code -- lib/src/messages.g.dart android/src/main/kotlin ios/doro_camera/Sources

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: |
            apps/mobile/coverage/lcov.info
            packages/doro_camera/coverage/lcov.info
