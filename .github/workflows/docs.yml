name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-tooling:
    name: Docs integrity and tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install tooling dependencies
        run: npm ci

      - name: Type check tooling
        run: npm run typecheck

      - name: Test tooling
        run: npm test

      - name: Check documentation integrity
        run: npm run check:docs
