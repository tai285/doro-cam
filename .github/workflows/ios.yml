name: ios

# iOS builds and tests run only on cloud macOS (ADR-0013): there is no local Mac.
# The repository is public, so GitHub-hosted macOS runners are free.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/doro_camera/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/ios-*.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/doro_camera/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/ios-*.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  core:
    name: Swift core unit tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: swift test (Flutter-free core, no simulator needed)
        env:
          DOROCAM_SWIFT_STANDALONE: "1"
        run: swift test --package-path packages/doro_camera/ios/doro_camera --enable-code-coverage

  simulator:
    name: iOS Simulator (unit + integration)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build for the simulator (no codesign)
        working-directory: apps/mobile
        run: flutter build ios --simulator --debug --no-codesign

      - name: Debug build contains the synthetic camera marker
        run: bash scripts/check-synthetic-camera.sh --expect-present apps/mobile/build/ios/iphonesimulator/Runner.app

      - name: Boot simulator
        id: sim
        run: |
          UDID="$(bash scripts/ios-simulator.sh)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Integration tests on the simulator
        timeout-minutes: 20
        working-directory: apps/mobile
        run: flutter test integration_test -d "${{ steps.sim.outputs.udid }}" --verbose

      - name: Release build excludes the synthetic camera (ADR-0013)
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign
          bash ../../scripts/check-synthetic-camera.sh --expect-absent build/ios/iphoneos/Runner.app

      - name: Simulator diagnostics
        if: failure() || cancelled()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "--- booted devices"; xcrun simctl list devices booted
          echo "--- installed apps"; xcrun simctl listapps "$UDID" 2>&1 | grep -E "CFBundleIdentifier|CFBundleDisplayName" | head -20 || true
          echo "--- Runner log (last 15 minutes)"
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "Runner" OR process == "runner" OR subsystem CONTAINS "flutter"' 2>&1 | tail -150 || true
          echo "--- crash reports"; ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -10 || true
