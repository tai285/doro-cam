name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "coverage-policy.json"
      - "tools/coverage-gate/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "coverage-policy.json"
      - "tools/coverage-gate/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --filter @doro/web format:check

      - name: Lint
        run: pnpm --filter @doro/web lint

      - name: Type check
        run: pnpm --filter @doro/web typecheck

      - name: Unit and component tests with coverage
        run: pnpm --filter @doro/web test:coverage

      - name: Coverage gate (policy floors and ratchet)
        run: node tools/coverage-gate/src/cli.ts . --only apps/web

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/lcov.info

  e2e:
    name: Playwright (Chromium, Firefox, WebKit, phone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @doro/web exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: pnpm --filter @doro/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
