# Dependency updates (docs/development/development-guide.md, dependency policy).
# Weekly and grouped, so review effort stays small. Every update runs the full CI before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node is pinned to the 24 LTS line everywhere (engines, CI, Dockerfile); its typings follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      typescript-tooling:
        patterns: ["typescript", "@types/*", "@typescript/*", "eslint*", "typescript-eslint", "prettier", "vitest", "@vitest/*"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      react:
        patterns: ["react", "react-dom", "react-router", "@types/react*", "@tanstack/*"]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter-runtime:
        patterns: ["flutter_riverpod", "go_router", "cupertino_icons"]

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 24 LTS line; move to the next LTS deliberately (an ADR-free but reviewed change).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
